name: Build and Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            deployment-target: ""
          - os: ubuntu-24.04-arm
            arch: aarch64
            deployment-target: ""
          - os: macos-latest
            arch: arm64
            deployment-target: "11.0"
          - os: macos-15-intel
            arch: x86_64
            deployment-target: "11.0"
          - os: windows-2022
            arch: AMD64
            deployment-target: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cibuildwheel>=4,<5"

      # On macOS and Windows the PostgreSQL build runs on the host, so it can be
      # cached between runs. On Linux cibuildwheel builds inside the manylinux
      # container, where the host cache is not visible.
      - name: Restore PostgreSQL build from cache
        if: runner.os != 'Linux'
        id: restore-postgres
        uses: actions/cache/restore@v4
        with:
          path: |
            pgbuild
            src/embedded_postgres/pginstall
          key: ${{ runner.os }}-${{ runner.arch }}-postgres-${{ hashFiles('Makefile', 'pgbuild/Makefile', '.github/workflows/build-and-test.yml') }}

      - name: Build PostgreSQL and pgvector on the host
        if: runner.os != 'Linux' && steps.restore-postgres.outputs.cache-hit != 'true'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment-target }}
        run: make

      - name: Save PostgreSQL build to cache
        if: runner.os != 'Linux' && steps.restore-postgres.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            pgbuild
            src/embedded_postgres/pginstall
          key: ${{ runner.os }}-${{ runner.arch }}-postgres-${{ hashFiles('Makefile', 'pgbuild/Makefile', '.github/workflows/build-and-test.yml') }}

      - name: Build wheels
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          # Baseline spike: one CPython per platform is enough to learn whether
          # the PostgreSQL build works on today's runners. The planned
          # py3-none-<platform> tag makes this moot.
          CIBW_BUILD: cp312-*
          CIBW_SKIP: pp* *-musllinux*
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment-target }}
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true
      - name: Create release with wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.whl \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
