name: Build and Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A push supersedes the run before it: only the newest code is worth the runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            deployment-target: ""
          - os: ubuntu-24.04-arm
            arch: aarch64
            deployment-target: ""
          - os: macos-latest
            arch: arm64
            deployment-target: "11.0"
          - os: macos-15-intel
            arch: x86_64
            deployment-target: "11.0"
          - os: windows-2022
            arch: AMD64
            deployment-target: ""
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment-target }}
      # PostgreSQL >= 17 needs Bison and Flex even from a release tarball. On
      # Windows they come from winflexbison (installed below) under these names;
      # PostgreSQL's configure honours BISON/FLEX. Empty on other platforms.
      BISON: ${{ startsWith(matrix.os, 'windows') && 'win_bison' || '' }}
      FLEX: ${{ startsWith(matrix.os, 'windows') && 'win_flex' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cibuildwheel>=4,<5"

      - name: Install Bison and Flex (Windows)
        if: runner.os == 'Windows'
        run: choco install winflexbison3 --no-progress -y

      - name: Toolchain report
        shell: bash
        run: |
          echo "make:  $(command -v make || true)"; make --version | head -1 || true
          echo "cc:    $(command -v gcc || command -v cc || true)"; (gcc --version || cc --version) 2>/dev/null | head -1 || true
          echo "perl:  $(command -v perl || true)"; perl --version | sed -n 2p || true
          for t in "${BISON:-bison}" "${FLEX:-flex}"; do echo "$t: $(command -v "$t" || echo MISSING)"; "$t" --version 2>/dev/null | head -1 || true; done

      # On macOS and Windows the PostgreSQL build runs on the host, so it can be
      # cached between runs. On Linux cibuildwheel builds inside the manylinux
      # container, where the host cache is not visible.
      - name: Restore PostgreSQL build from cache
        if: runner.os != 'Linux'
        id: restore-postgres
        uses: actions/cache/restore@v6
        with:
          path: |
            pgbuild
            src/embedded_postgres/pginstall
          key: ${{ runner.os }}-${{ runner.arch }}-postgres-${{ hashFiles('Makefile', 'pgbuild/Makefile', 'pgbuild/prepare.sh', '.github/workflows/build-and-test.yml') }}

      - name: Build PostgreSQL and pgvector on the host
        if: runner.os != 'Linux' && steps.restore-postgres.outputs.cache-hit != 'true'
        shell: bash
        run: make

      - name: Save PostgreSQL build to cache
        if: runner.os != 'Linux' && steps.restore-postgres.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            pgbuild
            src/embedded_postgres/pginstall
          key: ${{ runner.os }}-${{ runner.arch }}-postgres-${{ hashFiles('Makefile', 'pgbuild/Makefile', 'pgbuild/prepare.sh', '.github/workflows/build-and-test.yml') }}

      - name: Build wheels
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          # Windows: cibuildwheel puts its test venv under the user's Temp.
          # PostgreSQL's tools drop Administrator rights (restricted token)
          # before doing anything, and on the runner that folder is readable
          # only through the Administrators group — initdb then cannot even
          # stat its own binary ("invalid binary ...: Permission denied").
          # The runner's own temp on D: carries explicit user/Users ACEs.
          TEMP: ${{ startsWith(matrix.os, 'windows') && runner.temp || '' }}
          TMP: ${{ startsWith(matrix.os, 'windows') && runner.temp || '' }}
        run: python -m cibuildwheel --output-dir wheelhouse

      # Windows: the same wheel from two locations — the runner temp on D: and
      # the user's profile Temp on C: — to pin the "Permission denied" on ACLs.
      - name: Smoke-test the wheel (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          set -x
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/Scripts/python" -m pip install --quiet wheelhouse/*.whl
          BIN=$("$RUNNER_TEMP/smoke/Scripts/python" -c "import embedded_postgres._commands as c; print(c.POSTGRES_BIN_PATH)")
          echo "bin dir: $BIN"
          whoami; whoami /groups | grep -iE "admin|high|medium" || true
          icacls "$BIN\initdb.exe" || true
          icacls "$BIN\postgres.exe" || true
          "$BIN/initdb.exe" --version || echo "initdb --version FAILED ($?)"
          "$BIN/postgres.exe" --version || echo "postgres --version FAILED ($?)"
          "$BIN/pg_ctl.exe" --version || echo "pg_ctl --version FAILED ($?)"
          mkdir -p "$RUNNER_TEMP/pgdata-smoke"
          "$BIN/initdb.exe" -D "$RUNNER_TEMP/pgdata-smoke" --auth=trust -U postgres -E utf8 >/dev/null && echo "initdb on D: OK" || echo "initdb on D: FAILED ($?)"
          # --- the same wheel from the user's profile Temp on C: ---
          UTMP=$(cygpath -u "$LOCALAPPDATA")/Temp
          echo "profile temp: $UTMP"; icacls "$LOCALAPPDATA\Temp" || true
          python -m venv "$UTMP/ep-smoke"
          "$UTMP/ep-smoke/Scripts/python" -m pip install --quiet wheelhouse/*.whl
          BIN2=$("$UTMP/ep-smoke/Scripts/python" -c "import embedded_postgres._commands as c; print(c.POSTGRES_BIN_PATH)")
          icacls "$BIN2\initdb.exe" || true
          "$BIN2/initdb.exe" --version && echo "initdb --version from C: Temp OK" || echo "initdb --version from C: Temp FAILED ($?)"
          # and D:-located binaries writing a cluster into C: Temp — is it the binary's location or the data dir?
          "$BIN/initdb.exe" -D "$UTMP/pgdata-c" --auth=trust -U postgres -E utf8 >/dev/null && echo "D: binary, C: datadir OK" || echo "D: binary, C: datadir FAILED ($?)"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true
      - name: Create release with wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.whl \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
