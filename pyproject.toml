[project]
name = "embedded-postgres"
# Versioning mirrors the bundled PostgreSQL release: MAJOR.MINOR of PostgreSQL,
# third number is this package's own counter for a given PostgreSQL version.
version = "18.6.0"
description = "PostgreSQL server binaries as a pip-installable wheel, with a small Python layer to init, start and stop it"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Valeriy V. Pushkar" }]
keywords = ["postgresql", "postgres", "embedded", "pgvector", "wheel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = [
    "fasteners>=0.19",
    "platformdirs>=4.0.0",
    "psutil>=5.9.0",
]

[project.urls]
Repository = "https://github.com/kainpl/embedded-postgres"
Issues = "https://github.com/kainpl/embedded-postgres/issues"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-timeout",
    "psycopg2-binary",
    "sqlalchemy>=2",
    "sqlalchemy-utils",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["embedded_postgres*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
# One wheel per platform: the tag is py3-none-<platform> (see setup.py), so a
# single CPython is enough to build and test it.
build = "cp312-*"
skip = "pp* *-musllinux*"
before-all = "make"
test-extras = "test"
test-command = "bash -x {project}/cibuildwheel_test.bash {project}"

[tool.cibuildwheel.linux]
# Inside the manylinux container: install bison/flex/perl before building.
before-all = "bash pgbuild/prepare.sh && make"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
